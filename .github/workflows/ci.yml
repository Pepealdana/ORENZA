name: ORENZA CI

on:
  push:
    branches: ['feature/backend-mvp', 'main']
  pull_request:
    branches: ['feature/backend-mvp', 'main']

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - working-directory: backend
        run: npm install
      - working-directory: backend
        run: node --check src/server.js
      - working-directory: backend
        run: node --check src/routes/auth.routes.js
      - working-directory: backend
        run: node --check src/routes/student.routes.js
      - working-directory: backend
        run: node --check src/routes/counselor.routes.js
      - working-directory: backend
        run: node --check src/routes/admin.routes.js
